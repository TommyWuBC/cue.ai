<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northfield — Outerwear</title>
<link rel="stylesheet" href="/client/overlay.css">
<style>
  :root { --ink:#15171f; --muted:#6b7280; --line:#e6e7eb; --bg:#fbfbfc; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif; }
  header { padding:26px 40px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:20px;
           background:#fff; position:sticky; top:0; z-index:10; }
  header h1 { font-size:20px; margin:0; letter-spacing:-.02em; }
  header span { color:var(--muted); font-size:13px; }
  .cart { margin-left:auto; font-size:13px; color:var(--muted); }
  main { max-width:1160px; margin:0 auto; padding:36px 40px 120px; }
  h2 { font-size:15px; font-weight:600; margin:0 0 20px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:26px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .swatch { height:230px; }
  .body { padding:16px 18px 18px; }
  .title { font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
  .price { font-variant-numeric:tabular-nums; }
  .meta { color:var(--muted); font-size:13px; margin-top:6px; }
  .variants { display:flex; gap:7px; margin-top:14px; flex-wrap:wrap; }
  .variants button { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px;
                     font:inherit; font-size:13px; cursor:pointer; }
  .variants button[aria-pressed="true"] { border-color:var(--ink); background:var(--ink); color:#fff; }
  .actions { display:flex; gap:10px; margin-top:16px; }
  .actions button { flex:1; border:0; border-radius:11px; padding:12px; font:inherit; font-weight:600; cursor:pointer; }
  .add { background:#1a1f71; color:#fff; }
  .checkout-bar { position:fixed; right:24px; bottom:24px; }
  .checkout-bar button { background:#f7b600; border:0; border-radius:13px; padding:15px 26px;
                         font:inherit; font-weight:700; font-size:15px; cursor:pointer;
                         box-shadow:0 10px 28px rgba(0,0,0,.16); }
  .merchant-link { color:#1a1f71; font-size:13px; }
  #checkout-dialog { width:min(92vw,520px); border:0; border-radius:18px; padding:28px;
                     box-shadow:0 24px 80px rgba(0,0,0,.28); color:var(--ink); }
  #checkout-dialog::backdrop { background:rgba(14,16,28,.65); }
  #checkout-dialog h2 { margin:0 0 12px; color:var(--ink); font-size:21px; text-transform:none; }
  #checkout-dialog p { margin:10px 0; }
  .checkout-details { font-weight:600; }
  .checkout-message { min-height:40px; color:#5b4210; }
  .checkout-controls { display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }
  .checkout-controls button { border:0; border-radius:9px; padding:11px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .checkout-approve { background:#1a1f71; color:#fff; }
  .checkout-setup { background:#f7b600; color:#191919; }
  .checkout-controls button:disabled { opacity:.45; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Northfield</h1><span>Outerwear · Autumn</span>
  <div class="cart">Cart <b id="count">0</b> · Budget left <b id="budget">$250</b></div>
  <a class="merchant-link" href="/merchant.html" target="_blank" rel="noopener">Merchant view</a>
</header>
<main><h2>Jackets &amp; Coats</h2><div class="grid" id="grid"></div></main>
<div class="checkout-bar">
  <button data-aura-action="checkout" data-aura-label="Check out" onclick="checkout()">Check out</button>
</div>
<dialog id="checkout-dialog" aria-labelledby="checkout-title">
  <h2 id="checkout-title">Review demo order</h2>
  <p class="checkout-details"></p>
  <p class="checkout-message" role="status" aria-live="polite"></p>
  <div class="checkout-controls">
    <button class="checkout-setup" type="button" disabled>Set up passkey</button>
    <button class="checkout-approve" type="button" disabled>Approve with passkey</button>
    <button class="checkout-cancel" type="button">Cancel</button>
  </div>
</dialog>

<script type="module">
import { setupCheckout } from "/checkout.js";
const PRODUCTS = await fetch("/products.json").then(r => r.json());
const grid = document.getElementById("grid");
let cart = [], remaining = 25000;
const money = cents => "$" + (cents / 100).toFixed(2);
function renderCart() {
  document.getElementById("count").textContent = cart.length;
  document.getElementById("budget").textContent = money(remaining - cart.reduce((sum, p) => sum + Math.round(p.price * 100), 0));
}
const checkoutFlow = setupCheckout({
  getCart: () => cart,
  clearCart: () => { cart = []; renderCart(); },
  onStatus: status => { remaining = status.remaining_cents; renderCart(); },
});
window.cueCheckout = checkoutFlow;
window.checkout = checkoutFlow.prepare;

grid.innerHTML = PRODUCTS.map(p => `
  <article class="card" data-aura-product='${JSON.stringify(p).replace(/'/g, "&#39;")}'>
    <div class="swatch" style="background:linear-gradient(150deg,${p.tone},${p.tone}bb)"></div>
    <div class="body">
      <p class="title">${p.title}</p>
      <div class="price">$${p.price.toFixed(2)}</div>
      <div class="meta">${p.attrs.material.split(",")[0]} · ★ ${p.attrs.rating} (${p.attrs.reviews})</div>
      <div class="variants">${p.variants.map(v => `
        <button data-aura-action="select_variant" data-aura-value="${v}"
                data-aura-label="Size ${v}" aria-pressed="false">${v}</button>`).join("")}</div>
      <div class="actions">
        <button class="add" data-aura-action="add_to_cart" data-aura-label="Add ${p.title} to cart"
                data-id="${p.id}">Add to cart</button>
      </div>
    </div>
  </article>`).join("");

grid.addEventListener("click", (e) => {
  const v = e.target.closest('[data-aura-action="select_variant"]');
  if (v) {
    v.closest(".variants").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false"));
    v.setAttribute("aria-pressed", "true");
  }
  const a = e.target.closest('[data-aura-action="add_to_cart"]');
  if (a) {
    const p = PRODUCTS.find(x => x.id === a.dataset.id);
    const size = a.closest(".card").querySelector('[aria-pressed="true"]')?.dataset.auraValue ?? "M";
    cart.push({ ...p, size, words: window.cue?.lastActionUtterance || "" });
    renderCart();
  }
});
window.CART = () => cart;
</script>
<script src="/vendor/webgazer.js"></script>
<script type="module" src="/client/aura.js"></script>
</body>
</html>
